# LiveKit SFU - Yanki media node (Windows Server, standalone).
#
# Deliberately NOT configured here:
#   redis:      no Redis in the Yanki footprint. Without it LiveKit runs single-node
#               routing and each node is independent; the Yanki backend decides which
#               node hosts a room and hands the client a token for that node.
#   limit:      LiveKit's own capacity management is unavailable on Windows
#               (hwstats reports "CPU monitoring unsupported on current platform"),
#               so placement is driven by the Yanki backend, not by the SFU.
#
# This is a template and stays unfilled in the repository: never put a real key pair in
# this file. Install-LiveKitService.ps1 copies it next to livekit-server.exe
# (<InstallDir>\livekit.yaml) when no configuration is there yet, and the service is
# started with --config on that copy. Fill in the copy: replace every "<...>" placeholder,
# keeping the quotes. They are written as quoted strings on purpose: the template stays
# valid YAML, so it can be linted and diffed.

# Signalling / HTTP. YARP inside yanki.exe reverse-proxies this under
# https://yanki.corp/media/{node}/rtc (planned, M5), so 7880 never needs to face clients directly.
port: 7880

rtc:
  # Media ports. One UDP port is enough: LiveKit multiplexes every peer connection on it.
  udp_port: 7882
  # TCP fallback for clients whose network blocks UDP but allows outbound TCP.
  tcp_port: 7881
  # On-prem: never probe a STUN service for a public address. The node advertises the
  # address configured below.
  use_external_ip: false
  # The address clients must reach this node on. Set it per node - this is the single
  # most common cause of "connected, no media".
  node_ip: "<10.20.30.41>"

# Embedded TURN. No coturn in the Yanki footprint.
turn:
  enabled: true
  # Must resolve to this node and match the SAN of the certificate below.
  domain: "<media-01.yanki.corp>"
  udp_port: 3478
  tls_port: 5349
  # PEM certificate and key readable by the LiveKit service account. TURN/TLS on 5349 is
  # the fallback for clients that are blocked from using UDP entirely.
  cert_file: "<C:\\Program Files\\LiveKit\\turn-cert.pem>"
  key_file: "<C:\\Program Files\\LiveKit\\turn-key.pem>"
  # Set to true instead of cert_file/key_file when a load balancer terminates TLS for 5349.
  external_tls: false
  # TURN hands every relayed allocation its own UDP port out of this range, so the range
  # must be open inbound as well - forgetting it is the classic "TURN connects but no
  # media" failure. The defaults are 30000-40000; they are pinned here so the firewall
  # rules and the config cannot drift apart. Narrow the range if the network team insists,
  # but keep at least per_user_relay_allocation_limit ports per expected relayed
  # participant on this node.
  relay_range_start: 30000
  relay_range_end: 40000

# API credentials. The same pair goes into Yanki:Media:LiveKit:ApiKey / ApiSecret (planned, M5) on every
# Yanki node; yanki.exe mints the room tokens. Rotate with `lk` or by editing both sides.
keys:
  "<yanki>": "<api-secret-at-least-32-chars>"

# Room lifecycle events (participant joined/left, room finished, track published) are
# posted to the Yanki API, which is how the backend learns a room is empty and frees the
# node for the next meeting. DISABLED until M5: the endpoint does not exist yet, and with
# the block active every room event logs "failed to send webhook" and is retried. M5
# enables it by removing the first "# " on each line of the block below.
# webhook:
#   # Must be one of the keys above; LiveKit signs the webhook with it.
#   api_key: "<yanki>"
#   urls:
#     - https://yanki.corp/internal/livekit/webhook

room:
  # Close a room 60 s after it was created if nobody ever joined.
  empty_timeout: 60
  # Close a room 15 s after the last participant leaves, so a quick reconnect keeps it.
  departure_timeout: 15
  # Meetings are created by the backend through the server API, never implicitly by a
  # client that happens to hold a token.
  auto_create: false

logging:
  # Structured logs so the Yanki admin panel and any log shipper can parse them.
  json: true
  level: info
  # Per-participant/track detail; raise to 1 only while debugging a specific session.
  pion_level: error
