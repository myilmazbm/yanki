// Talky cluster bus: node-to-node gRPC full mesh (replaces an external NATS/Redis).
//
// Correctness NEVER depends on this bus. Every domain event is committed to SQL Server
// (with its per-conversation seq) before it is published here; the bus only makes
// delivery immediate. If a peer link is lost for longer than the tolerance window the
// receiving node tells its own WebSocket sessions to resync.
syntax = "proto3";

package talky.cluster.v1;

option csharp_namespace = "Talky.Cluster.V1";

service MeshService {
  // One long-lived bidirectional stream per (node, peer) pair. The dialing node sends
  // NodeHello first; the accepting node answers with its own NodeHello.
  rpc Stream(stream MeshFrame) returns (stream MeshFrame);
}

message MeshFrame {
  oneof body {
    NodeHello hello = 1;
    NodeBye bye = 2;
    Publish publish = 3;
    Heartbeat heartbeat = 4;
  }
}

message NodeHello {
  string node_id = 1;
  // Semantic version of talky.exe on that node; one minor version of skew is tolerated.
  string version = 2;
  // "api" | "worker" | "search" | "all"
  string role = 3;
  // Shared cluster secret hash so a stray node cannot join (mTLS is the primary control).
  string cluster_id = 4;
}

// Sent before a graceful shutdown so peers do not treat the disconnect as a partition.
message NodeBye {
  string node_id = 1;
}

message Publish {
  // Subject, e.g. "ev.conv.<conversation_id>", "ev.user.<user_id>", "presence", "typing.<conversation_id>".
  string subject = 1;
  // Event id (UUIDv7) for idempotent handling.
  string event_id = 2;
  // proto3-JSON encoded talky.v1.ServerFrame (or an internal event), depending on subject.
  bytes payload = 3;
  // Ephemeral events (typing, presence) are dropped first under backpressure.
  bool ephemeral = 4;
}

message Heartbeat {
  int64 ts = 1;
}
