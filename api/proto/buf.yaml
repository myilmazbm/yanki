version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    - PACKAGE_DIRECTORY_MATCH
    # Mesh.Stream is a symmetric bidirectional stream; both directions intentionally share MeshFrame.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - WIRE_JSON
  # The cluster mesh is not implemented yet; remove this exclusion when the mesh ships in M2.
  ignore:
    - yanki/cluster
